name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения, которых требует деплой через actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен только последний собранный main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm test

      - run: node build.js

      # build.js кладёт результат в dnd-dmg.html; Pages ждёт index.html в корне артефакта.
      - name: Собрать каталог для публикации
        run: |
          mkdir dist
          cp dnd-dmg.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
